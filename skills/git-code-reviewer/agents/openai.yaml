interface:
  display_name: "Git Code Reviewer"
  short_description: "提交 PR/MR 前按指定 base 审查完整分支"
  default_prompt: "Use $git-code-reviewer to review the complete current Python backend branch before PR/MR submission against base <base-ref>. If the placeholder has not been replaced, use a base explicitly provided by the user earlier in the conversation when it clearly applies to this review; otherwise ask `基础分支是什么？`. The placeholder itself is not a user-provided ref."
policy:
  allow_implicit_invocation: false
